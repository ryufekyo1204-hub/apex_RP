<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ece9e0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="APEX LOG">
  <title>APEX LOG</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- ===== REC ===== -->
    <div class="view" id="view-rec">
      <header class="app-header">
        <span class="h-title">APEX LOG</span>
        <span class="h-date" id="rec-date"></span>
      </header>
      <div class="view-scroll">

        <div class="field">
          <div class="field-label">RP</div>
          <div class="rp-num" id="rp-display">+0</div>
          <div class="adj-row">
            <button class="adj-btn" data-delta="-10">−10</button>
            <button class="adj-btn" data-delta="-1">−1</button>
            <button class="adj-btn" data-delta="1">＋1</button>
            <button class="adj-btn" data-delta="10">＋10</button>
          </div>
        </div>

        <div class="field">
          <div class="field-label">KILL</div>
          <div class="kill-grid" id="kill-grid"></div>
        </div>

        <div class="field">
          <div class="field-label">PARTY</div>
          <div class="seg-row" id="party-row">
            <button class="seg-btn" data-party="solo">SOLO</button>
            <button class="seg-btn" data-party="duo">DUO</button>
            <button class="seg-btn" data-party="full">FULL</button>
          </div>
        </div>

        <div class="field">
          <div class="field-label">感情 <span class="sub-hint">複数可</span></div>
          <div class="tag-wrap" id="emotion-tags"></div>
        </div>

        <div class="field">
          <div class="field-label">味方 <span class="sub-hint">複数可</span></div>
          <div class="tag-wrap" id="ally-tags"></div>
        </div>

        <div class="field">
          <div class="field-label">動き <span class="sub-hint">複数可</span></div>
          <div class="tag-wrap" id="play-tags"></div>
        </div>

        <button class="submit-btn" id="btn-save">記録する</button>
        <div class="bottom-pad"></div>
      </div>
    </div>

    <!-- ===== HIST ===== -->
    <div class="view hidden" id="view-hist">
      <header class="app-header">
        <span class="h-title">LOG</span>
        <button class="h-btn danger" id="clear-btn">全削除</button>
      </header>
      <div class="view-scroll">
        <div class="seg-row filter-row">
          <button class="seg-btn active" data-filter="today">今日</button>
          <button class="seg-btn" data-filter="week">今週</button>
          <button class="seg-btn" data-filter="all">全て</button>
        </div>
        <div id="hist-list"></div>
        <div id="hist-empty" class="empty hidden">記録がありません</div>
        <div class="bottom-pad"></div>
      </div>
    </div>

    <!-- ===== GRAPH ===== -->
    <div class="view hidden" id="view-graph">
      <header class="app-header">
        <span class="h-title">GRAPH</span>
      </header>
      <div class="view-scroll">

        <div class="graph-section">
          <div class="graph-title">時間帯別 RP</div>
          <div class="seg-row period-row">
            <button class="seg-btn active" data-period="day">今日</button>
            <button class="seg-btn" data-period="week">今週</button>
            <button class="seg-btn" data-period="month">今月</button>
          </div>
          <div id="bar-chart" class="chart-box"></div>
        </div>

        <div class="graph-section">
          <div class="graph-title">感情の分布</div>
          <div id="pie-chart" class="chart-box"></div>
        </div>

        <div class="bottom-pad"></div>
      </div>
    </div>

  </div>

  <nav id="nav">
    <button class="nav-btn active" data-view="rec">REC</button>
    <button class="nav-btn" data-view="hist">LOG</button>
    <button class="nav-btn" data-view="graph">GRAPH</button>
  </nav>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
